<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EBE5DD" />
    <meta
      name="description"
      content="Hourglass Pomodoro: un reloj de arena tranquilo para el navegador. La arena cae con el tiempo."
    />
    <meta property="og:title" content="Hourglass Pomodoro" />
    <meta
      property="og:description"
      content="Hourglass Pomodoro: un reloj de arena tranquilo para el navegador. La arena cae con el tiempo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hourglass Pomodoro" />
    <meta
      name="twitter:description"
      content="Hourglass Pomodoro: un reloj de arena tranquilo para el navegador. La arena cae con el tiempo."
    />
    <meta name="twitter:image" content="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hourglass Pomodoro</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var escena = 'lluvia';
        var tema = 'system';
        try { escena = localStorage.getItem('hourglass-web/escena') || 'lluvia'; } catch (e) {}
        try {
          var crudo = localStorage.getItem('hourglass-web/ajustes');
          if (!crudo) crudo = localStorage.getItem('reloj-de-arena/ajustes');
          if (crudo) tema = JSON.parse(crudo).theme || 'system';
        } catch (e) {}
        var oscuro = tema === 'dark' || (tema !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var nombre = escena === 'arena' || escena === 'clasico' ? escena : 'lluvia';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('fetchpriority', 'high');
        link.href = '/fondos/' + nombre + '-' + (oscuro ? 'oscuro' : 'claro') + '.webp';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
