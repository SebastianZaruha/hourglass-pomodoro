// Puente mínimo para apagar o encender Crashlytics en el proceso actual.
// El BOM es el de @react-native-firebase/app 27.1.0 (sdkVersions.android.firebase).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sebastianzaruha.relojdearena'
version = '1.8.13'

android {
  namespace 'com.sebastianzaruha.relojdearena.consent'
  defaultConfig {
    versionCode 1
    versionName '1.8.16'
  }
}

dependencies {
  implementation platform('com.google.firebase:firebase-bom:35.0.2')
  implementation 'com.google.firebase:firebase-crashlytics'
}
