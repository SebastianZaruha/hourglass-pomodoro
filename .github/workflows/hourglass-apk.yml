name: APK de prueba de Hourglass
on:
  push:
    branches:
      - fix/hourglass-web-android
    paths:
      - '.github/workflows/hourglass-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run web:build
      - run: npm run test --workspace @reloj/core
      - run: npx --no-install expo prebuild -p android --no-install
        working-directory: apps/mobile
      - run: npm run apk -- --out hourglass-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hourglass-prueba-apk
          path: hourglass-prueba.apk
          if-no-files-found: error
          retention-days: 14
